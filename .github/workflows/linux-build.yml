# Linux 环境自动编译：用 .NET SDK 编译 net481 WinForms exe（参考程序集方式），
# 显式指定 x64 与 ARM64（Windows on ARM）两个架构：上传为 artifact；Release 为手动发布。
name: linux-build

on:
  push:
    # main = 仓库原有项目；aria2 = 本项目（aria-gui）代码所在分支
    # 推送只编译 + 传 artifact，不发布 Release
    branches: [ main, aria2 ]
  pull_request:
  # 发布走手动触发：Actions 页 → linux-build → Run workflow（可填版本号）
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v1.1）；留空则用 build-<运行号>'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限（默认 token 为只读）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 编译 x64
        run: dotnet build aria-gui.csproj -c Release -p:PlatformTarget=x64 -p:AssemblyName=aria-gui-x64 --nologo

      - name: 编译 ARM64（Windows on ARM 原生版）
        run: dotnet build aria-gui.csproj -c Release -p:PlatformTarget=arm64 -p:AssemblyName=aria-gui-arm64 --nologo

      - name: 校验产物
        run: |
          ls -l bin/Release/net481/
          test -f bin/Release/net481/aria-gui-x64.exe
          test -f bin/Release/net481/aria-gui-arm64.exe
          file bin/Release/net481/aria-gui-x64.exe bin/Release/net481/aria-gui-arm64.exe

      - name: 上传两个 exe（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: aria-gui-exe
          path: |
            bin/Release/net481/aria-gui-x64.exe
            bin/Release/net481/aria-gui-arm64.exe
          if-no-files-found: error

      - name: 发布到 Releases（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # 填了版本号 → 用它作 tag；留空 → build-<运行号>
          tag_name: ${{ inputs.version != '' && inputs.version || format('build-{0}', github.run_number) }}
          files: |
            bin/Release/net481/aria-gui-x64.exe
            bin/Release/net481/aria-gui-arm64.exe
          generate_release_notes: true
